name: Crear instalador de Windows

on:
  workflow_dispatch:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependencias
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt
          pip install httpx

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Comprobar flujos compartidos
        run: |
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test tests/sync_ui.test.js

      - name: Compilar aplicación con PyInstaller
        shell: pwsh
        run: python build_windows.py

      - name: Comprobar aplicación compilada con datos temporales
        run: python verify_build.py

      - name: Instalar Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Crear instalador EXE
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "installer\SorprezzAssetManager.iss"

      - name: Publicar instalador
        uses: actions/upload-artifact@v4
        with:
          name: Sorprezz-Asset-Manager-Windows-Installer
          path: release/*.exe
          if-no-files-found: error
          retention-days: 30
